services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      DB_DIALECT: mysql
    ports:
      - '${PORT}:${PORT}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch(`http://127.0.0.1:$${process.env.PORT}/health`).then((res) => process.exit(res.ok ?
          0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: mysql:8.4
    container_name: blog-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${DB_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
